<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover sorgt dafür, dass die App bis in die Ecken (Notch, Home-Indicator) geht -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Veeno</title>

  <!-- Diese drei Meta-Tags sagen dem iPhone: "Öffne mich als eigene App ohne Safari-Leiste" -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Veeno" />
  <meta name="theme-color" content="#FF9E3E" />

  <!-- iOS ignoriert die Icons aus der manifest.webmanifest meistens - deshalb extra hier verlinkt -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ================= Bildschirm: Eintrag ================= -->
    <main id="screen-eintrag" class="screen">

      <!-- Kopfzeile: Logo + Name -->
      <header class="app-header">
        <img src="icons/icon-192.png" alt="" class="app-header__icon" />
        <span class="app-header__title">Veeno</span>
      </header>

      <!-- Anzeige des aktuell eingegebenen Betrags -->
      <div class="display" id="display">0 €</div>

      <!-- Eigenes Zahlenfeld statt iPhone-Tastatur -->
      <div class="keypad">
        <button class="key" data-digit="1">1</button>
        <button class="key" data-digit="2">2</button>
        <button class="key" data-digit="3">3</button>

        <button class="key" data-digit="4">4</button>
        <button class="key" data-digit="5">5</button>
        <button class="key" data-digit="6">6</button>

        <button class="key" data-digit="7">7</button>
        <button class="key" data-digit="8">8</button>
        <button class="key" data-digit="9">9</button>

        <button class="key key--muted" id="key-comma">,</button>
        <button class="key" data-digit="0">0</button>
        <button class="key key--muted" id="key-single-cent">0,0</button>

        <button class="key key--action" id="key-delete">⌫</button>
        <button class="key key--save" id="key-save">Speichern</button>
      </div>

      <!-- Gehört zum täglichen Workflow, deshalb hier und nicht auf dem Sparziel-Screen -->
      <button class="shift-btn" id="open-shift-dialog">Schicht abschließen</button>

      <!-- Liste der letzten Einträge - antippen öffnet den Bearbeiten-Dialog -->
      <section class="entries">
        <h2 class="entries__title">Letzte Einträge</h2>
        <ul class="entries__list" id="entries-list">
          <!-- wird von app.js gefüllt -->
        </ul>
        <p class="entries__empty" id="entries-empty">Noch keine Einträge heute.</p>
      </section>

      <p class="motivation-text" id="motivation-text"></p>
    </main>

    <!-- ================= Bildschirm: Sparziel ================= -->
    <main id="screen-sparziel" class="screen" hidden>
      <h1 class="screen-title">Sparziel</h1>

      <!-- Sparrücklage: laufende Gesamtsumme aller eingezahlten Beträge -->
      <section class="savings-card">
        <div class="savings-card__value" id="savings-total-value">0,00 €</div>
        <div class="savings-card__label">Sparrücklage</div>
        <div class="savings-card__chart" id="savings-chart"><!-- wird von app.js gefüllt --></div>
      </section>

      <!-- Becher-Bestand: wie viel Kleingeld aktuell insgesamt im Becher liegt.
           Bewusst kleiner/nachrangig gestaltet - die Sparrücklage oben ist
           die eigentlich wichtige Zahl. -->
      <section class="becher-card">
        <div class="becher-card__value" id="becher-bestand-value">0,00 €</div>
        <div class="becher-card__label">Im Becher (aktuell)</div>
      </section>

      <!-- Backup: alle Daten als JSON-Datei herunterladen (Absicherung gegen
           iOS' automatische Datenbereinigung bei längerer Nichtnutzung) -->
      <button class="export-link" id="export-data">Daten exportieren</button>
    </main>

    <!-- Tagessumme, immer sichtbar über der Menüleiste -->
    <div class="day-total">
      <span>Heute</span>
      <span id="day-total-value">0,00 €</span>
    </div>

    <!-- Untere Menüleiste -->
    <nav class="bottom-nav">
      <button class="nav-btn nav-btn--active" data-screen="eintrag">Eintrag</button>
      <button class="nav-btn" data-screen="verlauf" disabled>Verlauf</button>
      <button class="nav-btn" data-screen="sparziel">Sparziel</button>
    </nav>
  </div>

  <!-- ================= Dialog: Eintrag bearbeiten ================= -->
  <div class="modal-overlay" id="edit-overlay" hidden>
    <div class="modal">
      <div class="modal__header">
        <button class="modal__cancel" id="edit-cancel">Abbrechen</button>
        <h2>Eintrag bearbeiten</h2>
        <span class="modal__spacer"></span>
      </div>

      <div class="display" id="edit-display">0 €</div>

      <div class="keypad keypad--compact" id="edit-keypad">
        <button class="key" data-digit="1">1</button>
        <button class="key" data-digit="2">2</button>
        <button class="key" data-digit="3">3</button>

        <button class="key" data-digit="4">4</button>
        <button class="key" data-digit="5">5</button>
        <button class="key" data-digit="6">6</button>

        <button class="key" data-digit="7">7</button>
        <button class="key" data-digit="8">8</button>
        <button class="key" data-digit="9">9</button>

        <button class="key key--muted" id="edit-key-comma">,</button>
        <button class="key" data-digit="0">0</button>
        <button class="key key--muted" id="edit-key-single-cent">0,0</button>

        <button class="key key--action key--full-row" id="edit-key-delete-digit">⌫</button>
      </div>

      <label class="field-label" for="edit-time">Uhrzeit</label>
      <input type="time" id="edit-time" class="time-input" />

      <!-- Speichern und Löschen nebeneinander, damit der Dialog kompakt bleibt.
           Speichern bleibt optisch die Haupt-Aktion (doppelt so breit, Akzentfarbe),
           Löschen bleibt unauffällig (kein Rahmen, roter Text). -->
      <div class="modal__actions">
        <button class="key key--save modal__save-btn" id="edit-save-entry">Speichern</button>
        <button class="modal__delete-link" id="edit-delete-entry">Löschen</button>
      </div>
    </div>
  </div>

  <!-- ================= Dialog: Schicht abschließen (Becher-Logik) ================= -->
  <div class="modal-overlay" id="shift-overlay" hidden>
    <div class="modal">
      <div class="modal__header">
        <button class="modal__cancel" id="shift-cancel">Abbrechen</button>
        <h2>Schicht abschließen</h2>
        <span class="modal__spacer"></span>
      </div>

      <p class="shift-total">
        Heutiges Total<br />
        <strong id="shift-total-value">0,00 €</strong>
      </p>

      <!-- Wird beim Öffnen automatisch berechnet (volle 5€-Scheine eingezahlt,
           Rest im Becher) - beide Werte lassen sich danach antippen und ändern. -->
      <div class="split-cards">
        <label class="split-card split-card--paid">
          <span class="split-card__icon" aria-hidden="true">💳</span>
          <span class="split-card__label">Einzahlen</span>
          <span class="split-card__value-row">
            <input type="number" inputmode="decimal" step="0.01" min="0" id="shift-paid-out" class="split-card__value" />
            <span>€</span>
          </span>
        </label>

        <span class="split-cards__arrow" aria-hidden="true">⇄</span>

        <label class="split-card split-card--cup">
          <span class="split-card__icon" aria-hidden="true">🥤</span>
          <span class="split-card__label">Im Becher</span>
          <span class="split-card__value-row">
            <input type="number" inputmode="decimal" step="0.01" min="0" id="shift-in-cup" class="split-card__value" />
            <span>€</span>
          </span>
        </label>
      </div>

      <p class="split-check" id="split-check"></p>

      <button class="key key--save" id="shift-save">Speichern</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
